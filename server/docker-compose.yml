# Self-hosted production stack:  nginx (edge limits) → N API replicas → MongoDB Atlas, + Redis.
#   1. cp .env.example .env   and fill MONGODB_URI, JWT_SECRET (48+ chars), ANTHROPIC_API_KEY…
#   2. docker compose up -d --build
#   3. docker compose up -d --scale api=4     # scale horizontally
services:
  api:
    build: .
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "4000"
      REDIS_URL: redis://redis:6379
      TRUST_PROXY: "1" # exactly one proxy (nginx) in front; raise if a cloud LB sits before nginx
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      replicas: 2
      resources:
        limits: { cpus: "1.0", memory: 512M }
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    stop_grace_period: 30s

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "volatile-ttl"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    read_only: true
    security_opt: ["no-new-privileges:true"]

  nginx:
    image: nginx:1.27-alpine
    ports: ["80:80"]
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on: [api]
    restart: unless-stopped
