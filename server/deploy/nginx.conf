# Edge layer for the LEATCH API: per-IP rate/connection limits, slow-client timeouts,
# body-size caps and load balancing across API replicas. Put TLS (HTTPS) in front of this —
# a cloud load balancer, Cloudflare, or an extra `listen 443 ssl` server block.
worker_processes auto;

events {
  worker_connections 4096;
}

http {
  server_tokens off;
  sendfile on;
  tcp_nopush on;

  # Slow-client (slowloris) protection and size caps.
  client_header_timeout 10s;
  client_body_timeout 15s;
  send_timeout 30s;
  keepalive_timeout 65s;
  keepalive_requests 1000;
  client_max_body_size 6m;
  client_body_buffer_size 64k;
  large_client_header_buffers 4 8k;
  reset_timedout_connection on;

  # Per-IP limits (first line of DDoS defence; the API applies finer per-user limits behind it).
  limit_req_zone $binary_remote_addr zone=api_per_ip:20m rate=20r/s;
  limit_req_zone $binary_remote_addr zone=auth_per_ip:10m rate=10r/m;
  limit_conn_zone $binary_remote_addr zone=conn_per_ip:20m;
  limit_req_status 429;
  limit_conn_status 429;

  log_format json escape=json '{"time":"$time_iso8601","ip":"$remote_addr","method":"$request_method","uri":"$uri","status":$status,'
                              '"bytes":$body_bytes_sent,"rt":$request_time,"upstream":"$upstream_addr","request_id":"$request_id"}';
  access_log /dev/stdout json;
  error_log /dev/stderr warn;

  upstream leatch_api {
    zone leatch_api 64k;
    # Re-resolve Docker DNS so scaled/restarted replicas are picked up automatically.
    resolver 127.0.0.11 valid=10s ipv6=off;
    server api:4000 resolve max_fails=3 fail_timeout=10s;
    keepalive 64;
  }

  map $http_upgrade $connection_upgrade {
    default "";
  }

  server {
    listen 80 default_server;
    server_name _;

    proxy_http_version 1.1;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_next_upstream error timeout http_502 http_503;
    proxy_next_upstream_tries 2;

    location = /api/health {
      access_log off;
      proxy_pass http://leatch_api;
    }

    location ~ ^/api/auth/(login|register|password)$ {
      limit_req zone=auth_per_ip burst=5 nodelay;
      limit_conn conn_per_ip 10;
      proxy_pass http://leatch_api;
    }

    location /api/ai/ {
      limit_req zone=api_per_ip burst=20 nodelay;
      limit_conn conn_per_ip 20;
      proxy_read_timeout 160s; # AI analysis can legitimately take up to ~150 s
      proxy_next_upstream off; # never replay a paid AI request on another replica
      proxy_pass http://leatch_api;
    }

    location /api/ {
      limit_req zone=api_per_ip burst=40 nodelay;
      limit_conn conn_per_ip 50;
      proxy_pass http://leatch_api;
    }

    location / {
      return 404;
    }
  }
}
